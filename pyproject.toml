[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsnprog"
version = "0.1.0"
description = "لغة لسن (LSN) — نموذج ذكاء اصطناعي عربي رمزي-عصبي قائم على منطق القرآن"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
lsn = "lsnprog.cli:main"

[tool.setuptools]
packages = ["lsnprog"]
